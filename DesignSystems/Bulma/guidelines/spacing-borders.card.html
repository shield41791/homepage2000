<!-- @dsCard group="Spacing" viewport="700x140" name="Frame Border System" subtitle="Nested double border — 2px outer + 1px inner — the site's core containment motif" -->
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:#fff;padding:16px;box-sizing:border-box;display:flex;gap:16px">
<div style="border:2px solid var(--color-frame-border-outer);padding:1px;width:180px"><div style="border:1px solid var(--color-frame-border-inner);padding:10px;font-size:11px;color:#666">2px + 1px nested</div></div>
<div style="border:3px double #66a0cc;padding:2px;width:180px"><div style="padding:10px;font-size:11px;color:#666">3px double (photos)</div></div>
<div style="border:1px solid var(--blue-700);padding:10px;width:180px;font-size:11px;color:#666">1px plain (thumbnails)</div>
</body></html>
