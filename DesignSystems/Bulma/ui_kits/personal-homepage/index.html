<!-- @dsCard group="Personal Homepage" viewport="1180x720" name="Personal Homepage UI Kit" subtitle="Interactive click-through: splash gate → home → profile → board → photos → videos → projects" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
@keyframes kitMarquee{from{transform:translateX(110%)}to{transform:translateX(-110%)}}
body{margin:0;background:#fff;font-family:var(--font-body)}
a{color:var(--color-link)}
a:hover{color:var(--color-link-hover)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { Frame, Banner, Marquee, NewBadge, SidebarMenu, CategoryTabs, Pagination, LCDCounter, FooterPlayer, EffectSettingsPanel, EnterGate, BoardList, PostDetail, PhotoGrid, VideoGrid, ProjectGrid } = window.Homepy2000DesignSystem_793dff;

const NAV = [
  { key: 'home', label: '홈' }, { key: 'profile', label: '프로필' }, { key: 'notice', label: '공지사항' },
  { key: 'board', label: '게시판' }, { key: 'photos', label: '사진첩' }, { key: 'videos', label: '동영상' }, { key: 'projects', label: '프로젝트' },
];
const NOTICE = [
  { id: 1, no: 9, title: '홈페이지 리뉴얼 오픈했습니다!', date: '26.07.20', views: 342, isNew: true, content: '메뉴 구조를 새로 정리했습니다.\n공지/게시판/사진첩/동영상/프로젝트로 나눴어요.' },
  { id: 2, no: 8, title: '동영상 자료실 복구 완료', date: '26.07.18', views: 210, isNew: true, content: '유실됐던 동영상들을 다시 올려두었습니다.' },
  { id: 3, no: 5, title: '방명록 스팸 관련 안내', date: '26.06.20', views: 128, content: '광고성 글은 삭제될 수 있습니다.' },
];
const BOARD_CATS = [ { key: 'free', label: '자유게시판' }, { key: 'diary', label: '일기' }, { key: 'travel', label: '여행기' }, { key: 'devlog', label: '개발일지' } ];
const BOARD = {
  free: [ { id: 'f1', no: 24, title: '요즘 즐기는 게임 이야기', date: '26.07.19', views: 88, isNew: true, content: '스타듀밸리를 또 시작했다.' }, { id: 'f2', no: 20, title: '새 키보드 개봉기', date: '26.06.30', views: 156, content: '드디어 기계식 키보드를 질렀다.' } ],
  diary: [ { id: 'i1', no: 18, title: '오늘 날씨가 좋았다', date: '26.07.12', views: 41, isNew: true, content: '오랜만에 산책을 했다.' } ],
  travel: [ { id: 't1', no: 14, title: '부산 여행 다녀왔어요', date: '26.05.20', views: 190, content: '2박 3일 부산 여행 기록.' } ],
  devlog: [ { id: 'd1', no: 22, title: '파티클 효과 구현기', date: '26.07.15', views: 210, isNew: true, content: 'Canvas로 눈/벚꽃/낙엽/비 효과를 구현했다.' } ],
};
const PHOTO_CATS = ['ALL', '사진', '일러스트', '스크린샷'];
const PHOTOS = [ { id: 'p1', title: '부산 해운대', isNew: true }, { id: 'p2', title: '제주도 풍경' }, { id: 'p3', title: '캐릭터 스케치' }, { id: 'p4', title: '작업화면 캡처' } ];
const VIDEOS = [ { id: 'v1', title: '파티클 이펙트 데모', desc: '눈/벚꽃/낙엽/비', isNew: true }, { id: 'v2', title: '개발일지 브이로그', desc: '이번 주 작업 기록' }, { id: 'v3', title: '여행 브이로그', desc: '부산 2박 3일' } ];
const PROJECTS = [ { title: 'OOO닷컴', tagline: '개인 블로그 엔진', host: 'github.com', url: '#', isNew: true }, { title: '파티클 스튜디오', tagline: 'Canvas 날씨 이펙트 라이브러리', host: 'github.com', url: '#' } ];

function App(){
  const [entered, setEntered] = React.useState(false);
  const [mobile, setMobile] = React.useState(false);
  const [page, setPage] = React.useState('home');
  const [boardCat, setBoardCat] = React.useState('free');
  const [photoCat, setPhotoCat] = React.useState('ALL');
  const [selectedPost, setSelectedPost] = React.useState(null);
  const [selectedPhoto, setSelectedPhoto] = React.useState(null);
  const [selectedVideo, setSelectedVideo] = React.useState(null);
  const [playing, setPlaying] = React.useState(true);
  const [muted, setMuted] = React.useState(false);
  const [showSettings, setShowSettings] = React.useState(false);
  const [effect, setEffect] = React.useState('snow');
  const [reduceMotion, setReduceMotion] = React.useState(false);

  const goto = (p) => { setPage(p); setSelectedPost(null); setSelectedPhoto(null); };

  if (!entered) {
    return <EnterGate title="。。。의  홈 페 이 지" subtitle="- 게임 · 영화 · 음악 · 책을 좋아하는 사람의 작은 방 -"
      onEnter={() => setEntered(true)} today="128" total="004231" since="2002.03.14"
      copyright="Copyright(c) 2002.03.14 all right reserved" />;
  }

  const navItems = NAV.map(n => ({ label: n.label, active: n.key === page, onClick: () => goto(n.key) }));

  const content = () => {
    if (page === 'home') return <div>
      <Frame accent="blue" style={{ marginBottom: 14 }}>
        <div style={{ fontFamily: 'var(--font-logo)', fontSize: 19, color: '#0088cc' }}>환영합니다!! ^0^</div>
        <div style={{ fontSize: 13, lineHeight: 1.9, color: '#333', marginTop: 6 }}>안녕하세요~ 이 홈페이지 주인장입니다. 게임/영화/음악/책 그리고 만들고 있는 것들을 끄적여두는 개인 홈페이지예요.</div>
      </Frame>
      <div style={{ display: 'flex', gap: 12 }}>
        <Frame header="공지사항" headerRight="more▷" accent="green" style={{ flex: 1 }}>
          {NOTICE.slice(0,3).map(n => <div key={n.id} onClick={() => goto('notice')} style={{ fontSize: 12, padding: '3px 0', borderBottom: '1px dotted #e6eefb', cursor: 'pointer' }}>· {n.title} <NewBadge show={n.isNew}/></div>)}
        </Frame>
        <Frame header="자유게시판" headerRight="more▷" accent="green" style={{ flex: 1 }}>
          {BOARD.free.map(p => <div key={p.id} onClick={() => goto('board')} style={{ fontSize: 12, padding: '3px 0', borderBottom: '1px dotted #e6eefb', cursor: 'pointer' }}>· {p.title} <NewBadge show={p.isNew}/></div>)}
        </Frame>
        <Frame header="개발일지" headerRight="more▷" accent="green" style={{ flex: 1 }}>
          {BOARD.devlog.map(p => <div key={p.id} onClick={() => goto('board')} style={{ fontSize: 12, padding: '3px 0', borderBottom: '1px dotted #e6eefb', cursor: 'pointer' }}>· {p.title} <NewBadge show={p.isNew}/></div>)}
        </Frame>
      </div>
    </div>;

    if (page === 'profile') return <div>
      <div style={{ textAlign: 'center', fontFamily: 'var(--font-heading)', fontSize: 17, color: 'var(--color-frame-header-text)', fontWeight: 700, marginBottom: 14 }}>。゚ 프로필 ゚。</div>
      <div style={{ display: 'flex', gap: 18 }}>
        <div style={{ width: 180 }}>
          <div style={{ border: '3px double #66a0cc', padding: 2 }}><div style={{ width: '100%', height: 160, background: 'repeating-linear-gradient(45deg,var(--blue-400),var(--blue-400) 10px,#fff 10px,#fff 20px)' }} /></div>
          <div style={{ textAlign: 'center', marginTop: 8, fontSize: 11 }}><a href="#">X</a> · <a href="#">Insta</a> · <a href="#">GitHub</a></div>
        </div>
        <div style={{ fontSize: 13, lineHeight: 1.9, color: '#333' }}>
          <div style={{ background: '#0d5fc0', color: '#fff', fontFamily: 'var(--font-heading)', fontWeight: 700, padding: '3px 8px', marginBottom: 6 }}>▣ 자기소개</div>
          낮에는 평범한 직장인, 밤에는 이것저것 만들어보는 사람. 완성하면 꼭 여기다 기록으로 남겨둡니다 :)
          <div style={{ background: '#0d5fc0', color: '#fff', fontFamily: 'var(--font-heading)', fontWeight: 700, padding: '3px 8px', margin: '12px 0 6px' }}>▣ 좋아하는것들</div>
          게임 ▷ 스타듀밸리, 젤다의전설<br/>음악 ▷ 시티팝, 로파이힙합
        </div>
      </div>
    </div>;

    if (page === 'notice') return selectedPost
      ? <PostDetail title={selectedPost.title} author="주인장" date={selectedPost.date} views={selectedPost.views} content={selectedPost.content} onBack={() => setSelectedPost(null)} />
      : <div><BoardList total={NOTICE.length} page={1} totalPages={1} posts={NOTICE.map(n => ({ ...n, author: '주인장', onClick: () => setSelectedPost(n) }))} /></div>;

    if (page === 'board') return selectedPost
      ? <PostDetail title={selectedPost.title} author="주인장" date={selectedPost.date} views={selectedPost.views} content={selectedPost.content} onBack={() => setSelectedPost(null)} />
      : <div>
        <CategoryTabs tabs={BOARD_CATS.map(c => ({ label: c.label, active: c.key === boardCat, onClick: () => setBoardCat(c.key) }))} />
        <div style={{ marginTop: 8 }}><BoardList total={BOARD[boardCat].length} page={1} totalPages={1} posts={BOARD[boardCat].map(p => ({ ...p, author: '주인장', onClick: () => setSelectedPost(p) }))} /></div>
        <Pagination page={1} total={3} />
      </div>;

    if (page === 'photos') return selectedPhoto
      ? <div><div onClick={() => setSelectedPhoto(null)} style={{ fontSize: 12, color: 'var(--color-link)', cursor: 'pointer', marginBottom: 8 }}>◀ [ 목록으로 ]</div>
        <Frame header={selectedPhoto.title}><div style={{ width: '100%', height: 220, background: 'repeating-linear-gradient(45deg,var(--blue-400),var(--blue-400) 10px,#fff 10px,#fff 20px)', marginBottom: 10 }} /><div style={{ fontSize: 13 }}>사진 설명이 들어가는 자리입니다.</div></Frame></div>
      : <div>
        <div style={{ textAlign: 'center', marginBottom: 12, fontSize: 12 }}>{PHOTO_CATS.map(c => <span key={c} onClick={() => setPhotoCat(c)} style={c === photoCat ? { color: 'var(--color-frame-header-text)', fontWeight: 700 } : { color: 'var(--color-link)', cursor: 'pointer', marginLeft: 8 }}>{c === photoCat ? `[${c}]` : c}</span>)}</div>
        <PhotoGrid columns={4} photos={PHOTOS.map(p => ({ ...p, onClick: () => setSelectedPhoto(p) }))} />
      </div>;

    if (page === 'videos') return <div>
      <VideoGrid columns={3} videos={VIDEOS.map(v => ({ ...v, onClick: () => setSelectedVideo(v) }))} />
      {selectedVideo && <div onClick={() => setSelectedVideo(null)} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,.8)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 10000 }}>
        <div onClick={e => e.stopPropagation()} style={{ background: '#fff', border: '3px double #4d9fe6', padding: 10 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}><b style={{ fontSize: 13, color: '#0d5fc0' }}>▶ {selectedVideo.title}</b><span onClick={() => setSelectedVideo(null)} style={{ cursor: 'pointer', color: 'var(--color-link)' }}>✕ 닫기</span></div>
          <div style={{ width: 400, height: 225, background: '#000', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12 }}>[ 유튜브 embed 자리 ]</div>
        </div></div>}
    </div>;

    if (page === 'projects') return <div>
      <div style={{ fontSize: 11, color: '#888', textAlign: 'center', marginBottom: 12 }}>※ 섬네일 클릭 시 새 창에서 프로젝트 페이지로 이동합니다.</div>
      <ProjectGrid columns={4} projects={PROJECTS} />
    </div>;
  };

  return <div style={{ position: 'relative', minHeight: '100vh' }}>
    <div style={{ position: 'fixed', top: 0, right: 0, bottom: 0, width: 220, zIndex: 0, background: 'var(--color-sidebar-strip-bg)' }} />
    <div style={{ position: 'relative', zIndex: 1 }}>
      <Banner title="OOO's HomePage" domain="yourname.wo.to" onLogoClick={() => goto('home')} mobile={mobile} />
      <Marquee text="☆＊。 어서오세요 ~ 새 글은 메뉴 옆 [N] 표시를 확인하세요 ~ ♡ 。＊☆" />
      <div style={{ display: 'flex', alignItems: 'flex-start', padding: mobile ? 12 : '16px 26px 50px', gap: mobile ? 0 : 24 }}>
        {!mobile && <SidebarMenu profileLabel="。 주인장 。" groups={[
          { title: 'MENU', items: navItems.slice(0,2) },
          { title: '자료실', items: [{ ...navItems[3] }, { ...navItems[4], isNew: true }, { ...navItems[5] }] },
          { title: '커뮤니티', items: [{ ...navItems[2], isNew: true }, { ...navItems[6] }] },
        ]} />}
        <div style={{ flex: 1, minWidth: 0 }}>
          {mobile && <div style={{ display: 'flex', gap: 6, overflowX: 'auto', marginBottom: 10, paddingBottom: 4 }}>{navItems.map((n,i) => <span key={i} onClick={n.onClick} style={n.active ? { background: 'var(--blue-100)', border: '1px solid #5f8fff', color: 'var(--blue-900)', fontSize: 12, padding: '2px 8px', whiteSpace: 'nowrap' } : { color: 'var(--color-link)', fontSize: 12, padding: '2px 8px', whiteSpace: 'nowrap', cursor: 'pointer' }}>{n.label}</span>)}</div>}
          {content()}
        </div>
        {!mobile && <div style={{ width: 120, flex: 'none' }}>
          <LCDCounter today="128" total="004231" />
          <div style={{ textAlign: 'center', marginTop: 14, fontSize: 9, color: 'var(--color-text-faint)', lineHeight: 1.5 }}>best view<br/>1024*768<br/>익스플로러 6.0</div>
        </div>}
      </div>
      <FooterPlayer trackLabel="로파이 플레이리스트 - track 01" playing={playing} muted={muted}
        onTogglePlay={() => setPlaying(!playing)} onToggleMute={() => setMuted(!muted)} onToggleSettings={() => setShowSettings(!showSettings)}
        copyright="Copyright ⓒ 2002-2026. All rights reserved." mobile={mobile} />
      {showSettings && <EffectSettingsPanel effect={effect} onEffectChange={setEffect} reduceMotion={reduceMotion} onToggleReduceMotion={() => setReduceMotion(!reduceMotion)} onClose={() => setShowSettings(false)} />}
      <div style={{ textAlign: 'right', padding: '6px 24px', fontSize: 11 }}>
        <label style={{ cursor: 'pointer', color: 'var(--color-text-muted)' }}><input type="checkbox" checked={mobile} onChange={() => setMobile(!mobile)} /> 모바일 미리보기</label>
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
