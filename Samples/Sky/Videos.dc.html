<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; }
a { color: #1f4fd6; text-decoration: underline; }
a:hover { color: #ff5fa8; }
</style>
</helmet>

<div style="min-height: 100vh; width: 100%; background-image: url('uploads/wp2808032-windows-98-background.jpg'); background-repeat: repeat; background-size: 1024px 768px; font-family: 'Times New Roman', Times, serif; color: #223; padding-bottom: 40px;">

  <div style="text-align: center; padding: 20px 10px 10px; border-bottom: 3px double #6a95c7;">
    <a href="지수의 하늘정원.dc.html" style="display: inline-block; font-family: 'Times New Roman', Times, serif; font-size: 46px; font-weight: 700; color: #111; text-shadow: 2px 2px 0 #fff, 4px 4px 4px rgba(0,0,0,0.2); text-decoration: none;">
      Jisu's Sky Garden
    </a>
    <div style="font-size: 13px; font-weight: 700; color: #2255aa; margin-top: 2px;">zisu.homepy.to&nbsp; · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘</div>
  </div>

  <div style="display: flex; gap: 24px; align-items: flex-start; margin-top: 16px; padding: 0 24px;">
    <div style="width: 120px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; padding-top: 6px;">
      <a href="지수의 하늘정원.dc.html" style="font-size: 15px; font-weight: 700;">Home</a>
      <a href="Profile.dc.html" style="font-size: 15px; font-weight: 700;">Profile</a>
      <a href="Notices.dc.html" style="font-size: 15px; font-weight: 700;">Notices</a>
      <a href="Board.dc.html" style="font-size: 15px; font-weight: 700;">Board</a>
      <a href="Photos.dc.html" style="font-size: 15px; font-weight: 700;">Photos</a>
      <a href="Videos.dc.html" style="font-size: 15px; font-weight: 700; color: #ff5fa8;">Videos</a>
      <a href="Projects.dc.html" style="font-size: 15px; font-weight: 700;">Projects</a>
    </div>

    <div style="flex: 1; min-width: 0;">

      <div style="font-size: 22px; font-weight: 700; color: #0d5fc0; margin-bottom: 6px;">✿ Videos</div>
      <div style="font-size: 14px; font-weight: 700; color: #777; margin-bottom: 16px;">click a thumbnail to watch</div>

      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
        <sc-for list="{{ videos }}" as="v" hint-placeholder-count="6">
          <div>
            <div style="height: 130px; background: repeating-linear-gradient(45deg, #d6ecff, #d6ecff 10px, #ffffff 10px, #ffffff 20px); border: 2px solid #6a95c7; display: flex; align-items: center; justify-content: center; font-family: monospace; font-size: 10px; color: #557; text-align: center; position: relative;">
              [ video thumbnail ]
              <div style="position: absolute; width: 0; height: 0; border-top: 12px solid transparent; border-bottom: 12px solid transparent; border-left: 18px solid #1a3fd6;"></div>
            </div>
            <div style="font-size: 14px; font-weight: 700; text-align: center; margin-top: 4px; color: #333;">{{ v.title }}</div>
          </div>
        </sc-for>
      </div>

    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      videos: [
        { title: 'trip to the beach' },
        { title: 'my cat being silly' },
        { title: 'birthday party clip' },
        { title: 'karaoke night ㅋㅋ' },
        { title: 'school festival' },
        { title: 'random vlog #3' }
      ]
    };
  }
}

</script>
</body>
</html>
