<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; }
a { color: #1f4fd6; text-decoration: underline; }
a:hover { color: #ff5fa8; }
</style>
</helmet>

<div style="min-height: 100vh; width: 100%; background-image: url('uploads/wp2808032-windows-98-background.jpg'); background-repeat: repeat; background-size: 1024px 768px; font-family: 'Times New Roman', Times, serif; color: #223; padding-bottom: 40px;">

  <div style="text-align: center; padding: 20px 10px 10px; border-bottom: 3px double #6a95c7;">
    <a href="지수의 하늘정원.dc.html" style="display: inline-block; font-family: 'Times New Roman', Times, serif; font-size: 46px; font-weight: 700; color: #111; text-shadow: 2px 2px 0 #fff, 4px 4px 4px rgba(0,0,0,0.2); text-decoration: none;">
      Jisu's Sky Garden
    </a>
    <div style="font-size: 13px; font-weight: 700; color: #2255aa; margin-top: 2px;">zisu.homepy.to&nbsp; · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘</div>
  </div>

  <div style="display: flex; gap: 24px; align-items: flex-start; margin-top: 16px; padding: 0 24px;">
    <div style="width: 120px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; padding-top: 6px;">
      <a href="지수의 하늘정원.dc.html" style="font-size: 15px; font-weight: 700;">Home</a>
      <a href="Profile.dc.html" style="font-size: 15px; font-weight: 700;">Profile</a>
      <a href="Notices.dc.html" style="font-size: 15px; font-weight: 700;">Notices</a>
      <a href="Board.dc.html" style="font-size: 15px; font-weight: 700; color: #ff5fa8;">Board</a>
      <a href="Photos.dc.html" style="font-size: 15px; font-weight: 700;">Photos</a>
      <a href="Videos.dc.html" style="font-size: 15px; font-weight: 700;">Videos</a>
      <a href="Projects.dc.html" style="font-size: 15px; font-weight: 700;">Projects</a>
    </div>

    <div style="flex: 1; min-width: 0;">

      <div style="display: flex; gap: 16px; font-size: 16px; font-weight: 700; margin-bottom: 14px; flex-wrap: wrap;">
        <a href="#" style="color: #ff5fa8;">Free</a>
        <a href="#">Diary</a>
        <a href="#">Travelogue</a>
        <a href="#">Dev Log</a>
      </div>

      <div style="display: flex; font-weight: 700; font-size: 14px; color: #0d5fc0; border-bottom: 2px solid #6a95c7; padding: 6px 0;">
        <div style="width: 50px;">NO</div>
        <div style="flex: 1;">SUBJECT</div>
        <div style="width: 100px;">NAME</div>
        <div style="width: 90px;">DATE</div>
        <div style="width: 60px; text-align: right;">HIT</div>
      </div>

      <sc-for list="{{ posts }}" as="p" hint-placeholder-count="8">
        <div style="display: flex; font-size: 15px; font-weight: 700; color: #333; border-bottom: 1px solid #cfe4fb; padding: 8px 0;">
          <div style="width: 50px;">{{ p.no }}</div>
          <div style="flex: 1;">
            <sc-if value="{{ p.isNew }}" hint-placeholder-val="{{ false }}">
              <span style="color: #ff3333; margin-right: 4px;">[N]</span>
            </sc-if>
            <a href="PostDetail.dc.html?id={{ p.id }}" style="color: #333;">{{ p.title }}</a>
          </div>
          <div style="width: 100px; color: #777;">{{ p.name }}</div>
          <div style="width: 90px; color: #777;">{{ p.date }}</div>
          <div style="width: 60px; text-align: right; color: #777;">{{ p.hit }}</div>
        </div>
      </sc-for>

      <div style="text-align: center; margin-top: 20px; font-weight: 700; font-size: 15px;">
        [1] <a href="#">2</a> <a href="#">3</a>
      </div>

    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      posts: [
        { no: 3, id: 'board-1', title: "It's so hot I'm dying ㅋㅋ", name: 'jisu', date: '07.22', hit: 44, isNew: true },
        { no: 2, id: 'board-2', title: 'New puppy pics attached!!', name: 'jisu', date: '07.19', hit: 97, isNew: false },
        { no: 1, id: 'board-3', title: 'How is everyone? hiya~', name: 'jisu', date: '07.17', hit: 61, isNew: false }
      ]
    };
  }
}

</script>
</body>
</html>
