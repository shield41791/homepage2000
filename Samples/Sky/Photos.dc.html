<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; }
a { color: #1f4fd6; text-decoration: underline; }
a:hover { color: #ff5fa8; }
</style>
</helmet>

<div style="min-height: 100vh; width: 100%; background-image: url('uploads/wp2808032-windows-98-background.jpg'); background-repeat: repeat; background-size: 1024px 768px; font-family: 'Times New Roman', Times, serif; color: #223; padding-bottom: 40px;">

  <div style="text-align: center; padding: 20px 10px 10px; border-bottom: 3px double #6a95c7;">
    <a href="지수의 하늘정원.dc.html" style="display: inline-block; font-family: 'Times New Roman', Times, serif; font-size: 46px; font-weight: 700; color: #111; text-shadow: 2px 2px 0 #fff, 4px 4px 4px rgba(0,0,0,0.2); text-decoration: none;">
      Jisu's Sky Garden
    </a>
    <div style="font-size: 13px; font-weight: 700; color: #2255aa; margin-top: 2px;">zisu.homepy.to&nbsp; · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘</div>
  </div>

  <div style="display: flex; gap: 24px; align-items: flex-start; margin-top: 16px; padding: 0 24px;">
    <div style="width: 120px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; padding-top: 6px;">
      <a href="지수의 하늘정원.dc.html" style="font-size: 15px; font-weight: 700;">Home</a>
      <a href="Profile.dc.html" style="font-size: 15px; font-weight: 700;">Profile</a>
      <a href="Notices.dc.html" style="font-size: 15px; font-weight: 700;">Notices</a>
      <a href="Board.dc.html" style="font-size: 15px; font-weight: 700;">Board</a>
      <a href="Photos.dc.html" style="font-size: 15px; font-weight: 700; color: #ff5fa8;">Photos</a>
      <a href="Videos.dc.html" style="font-size: 15px; font-weight: 700;">Videos</a>
      <a href="Projects.dc.html" style="font-size: 15px; font-weight: 700;">Projects</a>
    </div>

    <div style="flex: 1; min-width: 0;">

      <div style="display: flex; gap: 16px; font-size: 16px; font-weight: 700; margin-bottom: 16px; flex-wrap: wrap;">
        <a href="#" style="color: #ff5fa8;">All</a>
        <a href="#">Photos</a>
        <a href="#">Illustration</a>
        <a href="#">Webtoon</a>
        <a href="#">Screenshots</a>
      </div>

      <div style="display: inline-block; border: 2px solid #999; padding: 6px;">
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #999; border-left: 1px solid #999;">
          <sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="8">
            <div style="border-right: 1px solid #999; border-bottom: 1px solid #999; padding: 10px;">
              <div style="width: 130px; height: 100px; background: repeating-linear-gradient(45deg, #d6ecff, #d6ecff 10px, #ffffff 10px, #ffffff 20px); border: 1px solid #6a95c7; display: flex; align-items: center; justify-content: center; font-family: monospace; font-size: 9px; color: #557; text-align: center;">
                [ {{ t.label }} ]
              </div>
              <div style="font-size: 13px; font-weight: 700; text-align: center; margin-top: 4px; color: #333;">{{ t.title }}</div>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="text-align: center; margin-top: 20px; font-weight: 700; font-size: 15px;">
        [1] <a href="#">2</a> <a href="#">3</a> <a href="#">4</a>
      </div>

    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const labels = ['photo','illustration','webtoon','screenshot'];
    const thumbs = [];
    for (let i = 1; i <= 8; i++) {
      thumbs.push({ label: labels[i % 4], title: 'untitled_' + i });
    }
    return { thumbs };
  }
}

</script>
</body>
</html>
