<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; }
a { color: #1f4fd6; text-decoration: underline; }
a:hover { color: #ff5fa8; }
</style>
</helmet>

<div style="min-height: 100vh; width: 100%; background-image: url('uploads/wp2808032-windows-98-background.jpg'); background-repeat: repeat; background-size: 1024px 768px; font-family: 'Times New Roman', Times, serif; color: #223; padding-bottom: 40px;">

  <div style="text-align: center; padding: 20px 10px 10px; border-bottom: 3px double #6a95c7;">
    <a href="지수의 하늘정원.dc.html" style="display: inline-block; font-family: 'Times New Roman', Times, serif; font-size: 46px; font-weight: 700; color: #111; text-shadow: 2px 2px 0 #fff, 4px 4px 4px rgba(0,0,0,0.2); text-decoration: none;">
      Jisu's Sky Garden
    </a>
    <div style="font-size: 13px; font-weight: 700; color: #2255aa; margin-top: 2px;">zisu.homepy.to&nbsp; · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘</div>
  </div>

  <div style="display: flex; gap: 24px; align-items: flex-start; margin-top: 16px; padding: 0 24px;">
    <div style="width: 120px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; padding-top: 6px;">
      <a href="지수의 하늘정원.dc.html" style="font-size: 15px; font-weight: 700;">Home</a>
      <a href="Profile.dc.html" style="font-size: 15px; font-weight: 700;">Profile</a>
      <a href="Notices.dc.html" style="font-size: 15px; font-weight: 700;">Notices</a>
      <a href="Board.dc.html" style="font-size: 15px; font-weight: 700;">Board</a>
      <a href="Photos.dc.html" style="font-size: 15px; font-weight: 700;">Photos</a>
      <a href="Videos.dc.html" style="font-size: 15px; font-weight: 700;">Videos</a>
      <a href="Projects.dc.html" style="font-size: 15px; font-weight: 700;">Projects</a>
    </div>

    <div style="flex: 1; min-width: 0;">

      <div style="font-size: 22px; font-weight: 700; color: #0d5fc0; margin-bottom: 10px;">{{ post.title }}</div>

      <div style="display: flex; gap: 16px; font-size: 13px; font-weight: 700; color: #777; border-top: 2px solid #6a95c7; border-bottom: 1px solid #cfe4fb; padding: 6px 0; margin-bottom: 16px;">
        <span>{{ post.author }}</span>
        <span>{{ post.date }}</span>
        <span>hit {{ post.hit }}</span>
      </div>

      <div style="display: flex; gap: 16px; align-items: flex-start; margin-bottom: 18px; flex-wrap: wrap;">
        <div style="width: 160px; height: 130px; flex-shrink: 0; background: repeating-linear-gradient(45deg, #d6ecff, #d6ecff 10px, #ffffff 10px, #ffffff 20px); border: 2px solid #6a95c7; display: flex; align-items: center; justify-content: center; font-family: monospace; font-size: 9px; color: #557; text-align: center;">
          [ image ]
        </div>
        <div style="flex: 1; min-width: 220px; font-size: 16px; font-weight: 700; line-height: 1.9; color: #333;">
          {{ post.body }}
        </div>
      </div>

      <hr style="border: none; border-top: 2px solid #6a95c7; margin: 18px 0;"/>

      <a href="{{ post.listHref }}" style="font-size: 15px; font-weight: 700;">◀ back to {{ post.listLabel }}</a>

    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const POSTS = {
  'notice-1': { title: '[Notice] Updated the photo album, come look ^^', author: 'jisu', date: '07.20', hit: 231, body: "Finally got around to uploading the summer pics!! Go check the Photos page ㅋㅋ took forever to resize them all with the free trial photo editor lol.", listHref: 'Notices.dc.html', listLabel: 'Notices' },
  'notice-2': { title: 'Please sign my guestbook ㅠㅠ', author: 'jisu', date: '07.15', hit: 158, body: "Nobody's been signing my guestbook lately... even just a hi would make me so happy ㅠㅠ don't be shy!!", listHref: 'Notices.dc.html', listLabel: 'Notices' },
  'notice-3': { title: 'Finally fixed up the site again', author: 'jisu', date: '07.10', hit: 302, body: "Been meaning to update this for months, finally did it. New layout, hope you guys like it! Let me know what you think ^^", listHref: 'Notices.dc.html', listLabel: 'Notices' },
  'board-1': { title: "It's so hot I'm dying ㅋㅋ", author: 'jisu', date: '07.22', hit: 44, body: "Seriously the AC in my room broke and I've just been laying on the floor all day like a puddle. Send help or ice cream, either works.", listHref: 'Board.dc.html', listLabel: 'Board' },
  'board-2': { title: 'New puppy pics attached!!', author: 'jisu', date: '07.19', hit: 97, body: "Meet Mongshil!! She's the sweetest little thing, sorry for spamming everyone's cursor with paw print gifs lately ㅋㅋ", listHref: 'Board.dc.html', listLabel: 'Board' },
  'board-3': { title: 'How is everyone? hiya~', author: 'jisu', date: '07.17', hit: 61, body: "Haven't posted in a while, just wanted to say hi to everyone still stopping by ^^ hope summer's treating you well!", listHref: 'Board.dc.html', listLabel: 'Board' }
};

class Component extends DCLogic {
  renderVals() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || 'notice-1';
    const post = POSTS[id] || POSTS['notice-1'];
    return { post };
  }
}

</script>
</body>
</html>
