<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; }
a { color: #1f4fd6; text-decoration: underline; }
a:hover { color: #ff5fa8; }
</style>
</helmet>

<div style="min-height: 100vh; width: 100%; background-image: url('uploads/wp2808032-windows-98-background.jpg'); background-repeat: repeat; background-size: 1024px 768px; font-family: 'Times New Roman', Times, serif; color: #223; padding-bottom: 40px;">

  <div style="text-align: center; padding: 20px 10px 10px; border-bottom: 3px double #6a95c7;">
    <a href="지수의 하늘정원.dc.html" style="display: inline-block; font-family: 'Times New Roman', Times, serif; font-size: 46px; font-weight: 700; color: #111; text-shadow: 2px 2px 0 #fff, 4px 4px 4px rgba(0,0,0,0.2); text-decoration: none;">
      Jisu's Sky Garden
    </a>
    <div style="font-size: 13px; font-weight: 700; color: #2255aa; margin-top: 2px;">zisu.homepy.to&nbsp; · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘ · ∘</div>
  </div>

  <div style="display: flex; gap: 24px; align-items: flex-start; margin-top: 16px; padding: 0 24px;">
    <div style="width: 120px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; padding-top: 6px;">
      <a href="지수의 하늘정원.dc.html" style="font-size: 15px; font-weight: 700;">Home</a>
      <a href="Profile.dc.html" style="font-size: 15px; font-weight: 700;">Profile</a>
      <a href="Notices.dc.html" style="font-size: 15px; font-weight: 700;">Notices</a>
      <a href="Board.dc.html" style="font-size: 15px; font-weight: 700;">Board</a>
      <a href="Photos.dc.html" style="font-size: 15px; font-weight: 700;">Photos</a>
      <a href="Videos.dc.html" style="font-size: 15px; font-weight: 700;">Videos</a>
      <a href="Projects.dc.html" style="font-size: 15px; font-weight: 700; color: #ff5fa8;">Projects</a>
    </div>

    <div style="flex: 1; min-width: 0;">

      <div style="font-size: 22px; font-weight: 700; color: #0d5fc0; margin-bottom: 14px;">✿ Projects</div>

      <div style="display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap;">

        <div style="width: 130px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px;">
          <sc-for list="{{ projects }}" as="p" hint-placeholder-count="6">
            <a href="#" onClick="{{ p.select }}" style="font-size: 15px; font-weight: 700; text-decoration: {{ p.deco }}; color: {{ p.color }};">{{ p.title }}</a>
          </sc-for>
        </div>

        <div style="display: flex; flex-wrap: wrap; flex: 1; min-width: 260px; border: 3px double #6a95c7;">
          <div style="padding: 14px; width: 180px; flex-shrink: 0; border-right: 3px double #6a95c7;">
            <div style="font-size: 17px; font-weight: 700; color: #0d5fc0; margin-bottom: 10px;">{{ current.title }}</div>
            <div style="width: 150px; height: 120px; background: repeating-linear-gradient(45deg, #d6ecff, #d6ecff 10px, #ffffff 10px, #ffffff 20px); border: 2px solid #6a95c7; display: flex; align-items: center; justify-content: center; font-family: monospace; font-size: 9px; color: #557; text-align: center;">
              [ project image ]
            </div>
          </div>
          <div style="padding: 14px; flex: 1; min-width: 200px;">
            <div style="font-size: 15px; font-weight: 700; line-height: 1.8; color: #333;">
              {{ current.desc }}
            </div>
            <div style="margin-top: 14px; font-size: 14px; font-weight: 700;">
              <a href="{{ current.link }}" target="_blank">▶ open project link</a>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { selected: 0 };

  renderVals() {
    const data = [
      { title: 'guestbook script', desc: 'A tiny CGI guestbook I hacked together with a friend. Nothing fancy, just name/message/date ^^', link: '#' },
      { title: 'fan-made mp3 player', desc: 'Flash-based mp3 player skin I made for my old Cyworld page. Repeat/Random buttons included ㅋㅋ', link: '#' },
      { title: 'html layout collection', desc: 'A bunch of homepage layout templates I collected and tweaked over the years.', link: '#' },
      { title: 'cursor trail effect', desc: 'Sparkly mouse trail script, copy-pasted and edited from a webmaster forum lol.', link: '#' },
      { title: 'clock widget', desc: 'A little JS clock widget with a cutesy font. Used to sit at the bottom of my old page.', link: '#' },
      { title: 'visitor counter cgi', desc: 'Simple visitor counter perl script, digit images and all.', link: '#' }
    ];

    const projects = data.map((d, i) => ({
      title: d.title,
      select: () => this.setState({ selected: i }),
      color: i === this.state.selected ? '#ff5fa8' : '#1f4fd6',
      deco: i === this.state.selected ? 'underline' : 'underline'
    }));

    return { projects, current: data[this.state.selected] };
  }
}

</script>
</body>
</html>
