<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<style>
body { margin: 0; background: #000; }
a { color: #66d9ff; text-decoration: none; }
a:hover { color: #ff66cc; }
::-webkit-scrollbar { width: 14px; background: #000; }
::-webkit-scrollbar-thumb { background: #ff9900; border: 1px solid #663300; }
</style>
</helmet>

<div style="min-height: 100vh; width: 100%; background: #000; font-family: 'Batang', 'BatangChe', 'Times New Roman', serif; color: #ddd; padding-bottom: 60px;">

  <div style="display: flex; align-items: flex-end; gap: 10px; padding: 8px 10px 0;">
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <a href="#" onClick="{{ comingSoon }}" style="background: #d9d9d9; border: 1px outset #fff; color: #000; font-size: 10px; font-weight: 700; padding: 2px 6px; text-align: center;">시작페이지로</a>
      <a href="#" onClick="{{ comingSoon }}" style="background: #d9d9d9; border: 1px outset #fff; color: #000; font-size: 10px; font-weight: 700; padding: 2px 6px; text-align: center;">즐겨찾기추가</a>
    </div>
    <a href="Home.dc.html" style="display: block; width: 260px; height: 62px; background: #12245c; border: 4px outset #6688cc; display: flex; align-items: center; justify-content: center; text-decoration: none;">
      <span style="color: #ffff00; font-size: 24px; font-weight: 700; text-shadow: 2px 2px 0 #000000;">칠흑's 다크로드</span>
    </a>
  </div>

  <div style="padding: 10px 14px; border-bottom: 1px solid #333;">
    <marquee behavior="scroll" direction="left" scrollamount="4" style="background: #0a0a0a; border: 1px solid #334; color: #00ff00; font-family: 'Courier New', monospace; font-size: 13px; padding: 5px 10px;">
      그동안 만들어본 것들을 모아뒀습니다.. 섬네일 누르면 새 창으로 이동해요~
    </marquee>
  </div>

  <div style="display: flex; align-items: flex-start; gap: 0; margin-top: 4px;">

    <div style="width: 190px; flex-shrink: 0; background: #141414; border-right: 2px solid #3a2a10; padding: 16px 18px; box-sizing: border-box; min-height: 640px;">
      <div style="color: #ffaa33; font-weight: 800; font-size: 13px; letter-spacing: 2px; margin-bottom: 10px;">MENU</div>
      <div style="display: flex; flex-direction: column; gap: 9px; font-size: 14px; font-weight: 700; margin-bottom: 20px;">
        <a href="Home.dc.html" style="color: #cfcfcf;">- 홈</a>
        <a href="Profile.dc.html" style="color: #cfcfcf;">- 프로필</a>
        <a href="Notice.dc.html" style="color: #cfcfcf;">- 공지사항</a>
        <a href="Board.dc.html" style="color: #cfcfcf;">- 게시판</a>
        <a href="Photos.dc.html" style="color: #cfcfcf;">- 사진첩</a>
        <a href="Videos.dc.html" style="color: #cfcfcf;">- 동영상</a>
        <a href="Projects.dc.html" style="color: #ffffff;">- 프로젝트</a>
      </div>
      <div style="border-top: 3px double #ff9900; padding-top: 12px; margin-bottom: 16px;">
        <a href="#" onClick="{{ comingSoon }}" style="display: block; font-size: 13px; font-weight: 700; color: #ffcc66;">✎ 방명록 남기기</a>
      </div>
      <div style="border-top: 3px double #ff9900; padding-top: 12px; font-size: 11px; color: #888; line-height: 1.8;">
        전체회원 : 1,204 명<br/>오늘가입 : 3 명
      </div>
    </div>

    <div style="flex: 1; min-width: 0; padding: 20px 24px;">
      <div style="color: #ffcc00; font-size: 19px; font-weight: 700; margin-bottom: 16px;">칠흑's 프로젝트</div>

      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;">
        <sc-for list="{{ projects }}" as="pr" hint-placeholder-count="4">
          <a href="#" onClick="{{ comingSoon }}" style="display: block; text-decoration: none;">
            <div style="width: 100%; aspect-ratio: 4/3; background: repeating-linear-gradient(45deg, #1a1a1a, #1a1a1a 8px, #0a0a0a 8px, #0a0a0a 16px); border: 2px solid #665500; display: flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; font-size: 10px; color: #886600; text-align: center;">
              [ 프로젝트 썸네일 ]
            </div>
            <div style="font-size: 13px; color: #ccc; text-align: center; margin-top: 4px; font-weight: 700;">{{ pr.title }}</div>
            <div style="font-size: 11px; color: #888; text-align: center;">{{ pr.desc }}</div>
          </a>
        </sc-for>
      </div>

    </div>
  </div>

  <div style="position: fixed; bottom: 0; left: 0; right: 0; display: flex; align-items: stretch; height: 26px; z-index: 10;">
    <div style="background: #12245c; border-right: 3px outset #6688cc; color: #ffff00; font-size: 12px; font-weight: 800; display: flex; align-items: center; padding: 0 12px;">공지</div>
    <marquee behavior="scroll" direction="left" scrollamount="3" style="flex: 1; background: #000; color: #ccc; font-size: 12px; display: flex; align-items: center;">
      ▶ 다크로드 온라인 정기점검 안내: 매주 목요일 오전 6시~9시&nbsp;&nbsp;&nbsp;&nbsp;▶ 게시판 이용 시 서로 예의를 지켜주세요&nbsp;&nbsp;&nbsp;&nbsp;▶ 홈페이지 방문해주셔서 감사합니다 (_ _)
    </marquee>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      comingSoon: (e) => { e.preventDefault(); window.alert('아직 준비중인 페이지입니다. 실제로는 새 창으로 이동합니다.'); },
      projects: [
        { title: '길드 사이트 만들기', desc: '길드원들과 함께 만든 소개 페이지' },
        { title: '경치 계산기', desc: '경험치 효율 계산용 웹 도구' },
        { title: '사냥터 지도 정리', desc: '주요 사냥터 위치 정리 페이지' }
      ]
    };
  }
}

</script>
</body>
</html>
