<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; }
a { text-decoration: none; }
</style>
</helmet>

<div style="min-height:100vh;background-color:#ffe1f0;background-image:radial-gradient(circle,#ffffff 1.5px,transparent 2px),radial-gradient(circle,#ffc2e2 1.5px,transparent 2px);background-size:28px 28px,28px 28px;background-position:0 0,14px 14px;font-family:'Gulim','Dotum',sans-serif;padding:22px 0 60px;box-sizing:border-box;">
  <div style="width:780px;max-width:100%;margin:0 auto;background:#fff9fc;border:3px solid #ff8fc7;box-sizing:border-box;">

    <div style="height:130px;background:repeating-linear-gradient(90deg,#ffd1ec 0,#ffd1ec 20px,#ffe9f6 20px,#ffe9f6 40px,#e3d3ff 40px,#e3d3ff 60px,#cfeaff 60px,#cfeaff 80px);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;">
      <span style="position:absolute;top:10px;left:16px;font-size:20px;">✧</span>
      <span style="position:absolute;top:14px;right:20px;font-size:16px;">❀</span>
      <a href="Home.dc.html"><div style="font-family:'Comic Sans MS','Gungsuh',cursive;font-size:50px;font-weight:700;color:#ff2f8f;-webkit-text-stroke:2px #fff;text-shadow:4px 4px 0 #ffb3da;letter-spacing:1px;">소이의 딸기우유</div></a>
      <div style="font-family:'Courier New',monospace;font-size:12px;color:#b04fd6;letter-spacing:1px;margin-top:4px;">* http://strawberrymilk.wo.to *</div>
    </div>

    <div style="background:#fff;border-top:2px dotted #ff9ecf;border-bottom:2px dotted #ff9ecf;padding:9px 6px;display:flex;justify-content:center;align-items:center;gap:2px;flex-wrap:wrap;font-size:13px;font-weight:700;">
      <a href="Home.dc.html" style="color:#b04fd6;padding:3px 6px;">Home</a><span style="color:#f0b8d8;">::::</span>
      <a href="Profile.dc.html" style="color:#b04fd6;padding:3px 6px;">Profile</a><span style="color:#f0b8d8;">::::</span>
      <a href="Notice.dc.html" style="color:{{ navColors.notice }};padding:3px 6px;">Notice</a><span style="color:#f0b8d8;">::::</span>
      <a href="Board.dc.html" style="color:{{ navColors.board }};padding:3px 6px;">Board</a><span style="color:#f0b8d8;">::::</span>
      <a href="Photos.dc.html" style="color:{{ navColors.photos }};padding:3px 6px;">Photos</a><span style="color:#f0b8d8;">::::</span>
      <a href="Videos.dc.html" style="color:#b04fd6;padding:3px 6px;">Videos</a><span style="color:#f0b8d8;">::::</span>
      <a href="Projects.dc.html" style="color:#b04fd6;padding:3px 6px;">Projects</a>
    </div>

    <div style="padding:22px 26px;">
      <div style="border-bottom:2px dotted #f0b8d8;padding-bottom:12px;margin-bottom:16px;">
        <div style="font-size:19px;color:#7a3a63;font-weight:700;">{{ post.title }}</div>
        <div style="font-size:12px;color:#c98cb0;margin-top:6px;">
          {{ post.name }} &nbsp;|&nbsp; {{ post.date }} &nbsp;|&nbsp; 조회 {{ post.hit }}
        </div>
      </div>

      <sc-if value="{{ post.image }}" hint-placeholder-val="{{ false }}">
        <div style="width:100%;max-width:420px;margin:0 auto 18px;aspect-ratio:4/3;background:repeating-linear-gradient(45deg,#ffd6ea,#ffd6ea 8px,#ffe9f4 8px,#ffe9f4 16px);border:2px solid #ff9ecf;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:11px;color:#b04fd6;">
          [ {{ post.title }} 이미지 ]
        </div>
      </sc-if>

      <div style="font-size:14px;color:#7a3a63;line-height:2;min-height:120px;white-space:pre-line;">{{ post.body }}</div>

      <div style="margin-top:26px;text-align:right;">
        <a href="{{ post.backHref }}" style="color:#b04fd6;font-size:12px;font-weight:700;">« 목록으로</a>
      </div>
    </div>

    <div style="text-align:center;padding:14px 10px;border-top:2px dotted #ff9ecf;font-size:11px;color:#b04fd6;">
      ❀ Copyright(c) 2003 Soi. All rights reserved. ❀
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const params = new URLSearchParams(window.location.search);
    const board = params.get('board') || 'notice';
    const id = params.get('id') || '';

    const data = {
      notice: [
        { id: 'n5', date: '2003-11-02', title: '레이아웃 살짝 바꿨어요 ㅋㅋ', hit: 82, body: '오랜만에 홈피 레이아웃 살짝 손봤어요~ 배경도 좀 더 반짝반짝하게 바꿔봤는데 어떤가요?? 예쁘게 봐주세요 ㅎㅎ' },
        { id: 'n4', date: '2003-10-20', title: '방명록 자동삭제 테스트중', hit: 41, body: '방명록에 이상한 광고글 자꾸 달려서 자동삭제 기능 테스트하고 있어요. 혹시 글 남겼는데 사라졌으면 죄송해요 ㅠㅠ' },
        { id: 'n3', date: '2003-10-11', title: '메신저 아이디 바꿨어요', hit: 55, body: '기존 아이디에 문제가 좀 있어서 메신저 아이디 새로 팠어요~ 자세한건 프로필 참고해주세요!' },
        { id: 'n2', date: '2003-09-30', title: '홈피 오픈했습니다~', hit: 63, body: '드디어 제 홈페이지 오픈했어요!! 이것저것 천천히 채워나갈게요 ㅎㅎ 자주 놀러와주세요~' },
        { id: 'n1', date: '2003-09-30', title: '환영합니다 ^^', hit: 90, body: '제 작은 홈페이지에 오신걸 환영해요~ 편하게 둘러보고 가세요 ♡' }
      ],
      board: [
        { id: 'b6', name: '소이', date: '2003-11-05', title: '오늘 학교에서 있었던일 ㅋㅋ', hit: 71, body: '오늘 급식시간에 완전 웃긴일 있었는데ㅋㅋㅋ 친구가 국물을 옷에 다 흘려서 다들 배꼽빠지는줄 ㅋㅋㅋㅋ\n그래도 재밌는 하루였어요 ^^' },
        { id: 'b5', name: '소이', date: '2003-11-01', title: '요즘 너무 우울해요 ㅠㅠ', hit: 38, body: '요즘 시험기간이라 그런지 기분이 계속 다운돼요 ㅠㅠ\n다들 힘내라고 응원 좀 해주세요... 흑흑' },
        { id: 'b4', name: '소이', date: '2003-10-28', title: '새로산 다이어리 자랑*^^*', hit: 64, body: '용돈 모아서 드디어 예쁜 다이어리 샀어요!! 스티커도 잔뜩 붙여놓을거에요 ㅎㅎ 완전 맘에 들어요♡' },
        { id: 'b3', name: '소이', date: '2003-10-15', title: '지난 주말 대구 다녀온 후기', hit: 52, body: '주말에 가족이랑 대구 다녀왔어요~ 맛있는것도 많이 먹고 오랜만에 사촌언니도 만나서 완전 좋았어요 ㅎㅎ' },
        { id: 'b2', name: '소이', date: '2003-10-02', title: '일기 쓰기 다짐', hit: 29, body: '이제부터 진짜 매일매일 일기 써볼려구요! 작심삼일 되지 않게 화이팅해야겠다 ㅋㅋ' },
        { id: 'b1', name: '소이', date: '2003-09-30', title: '첫 글이에요~', hit: 80, body: '게시판 첫 글이네요*^^* 앞으로 이런저런 얘기 많이 올릴게요~ 잘 부탁드려요!' }
      ],
      photos: [
        { id: 'p1', name: '소이', date: '2003-09-15', title: '소이 셀카*^^*', hit: 120, image: true, body: '오랜만에 찍어본 셀카에요 ㅎㅎ 어색하지만 나름 맘에 들어서 올려봐요~' },
        { id: 'p2', name: '소이', date: '2003-09-18', title: '먼지랑 같이', hit: 95, image: true, body: '우리집 강아지 먼지랑 같이 찍었어요! 완전 귀엽죠?? ㅎㅎ' },
        { id: 'p3', name: '소이', date: '2003-09-22', title: '낙서 하나', hit: 44, image: true, body: '심심해서 끄적여본 낙서에요. 잘 못그렸지만 귀엽게 봐주세요 ㅋㅋ' },
        { id: 'p4', name: '소이', date: '2003-09-25', title: '좋아하는 캐릭터 그려봄', hit: 58, image: true, body: '요즘 푹 빠져있는 캐릭터 그려봤어요! 색칠하는데 시간 완전 오래걸렸어요 ㅠㅠ' },
        { id: 'p5', name: '소이', date: '2003-10-01', title: '짧은 만화 1화', hit: 66, image: true, body: '짧게 그려본 만화 1화에요~ 다음화도 열심히 그려볼게요!' },
        { id: 'p6', name: '소이', date: '2003-10-05', title: '짧은 만화 2화', hit: 61, image: true, body: '만화 2화 완성했어요! 이야기가 점점 산으로 가는듯 ㅋㅋㅋ' },
        { id: 'p7', name: '소이', date: '2003-10-08', title: '좋아하는 게임 캡처', hit: 73, image: true, body: '요즘 재밌게 하는 게임 화면 캡처해봤어요! 그래픽 진짜 예쁘지 않나요?' },
        { id: 'p8', name: '소이', date: '2003-10-10', title: '예쁜 배경화면 캡처', hit: 50, image: true, body: '인터넷서 발견한 넘 예쁜 배경화면이라 저장해뒀어요~ 다들 써보세요!' }
      ]
    };

    const list = data[board] || data.notice;
    const post = list.find(p => p.id === id) || list[0];
    const backHrefMap = { notice: 'Notice.dc.html', board: 'Board.dc.html', photos: 'Photos.dc.html' };
    const navColors = {
      notice: board === 'notice' ? '#ff2f8f' : '#b04fd6',
      board: board === 'board' ? '#ff2f8f' : '#b04fd6',
      photos: board === 'photos' ? '#ff2f8f' : '#b04fd6'
    };

    return {
      post: { ...post, backHref: backHrefMap[board] || 'Notice.dc.html' },
      navColors
    };
  }
}

</script>
</body>
</html>
