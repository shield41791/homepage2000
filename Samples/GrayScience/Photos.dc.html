<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; }
a { color: #0000cc; text-decoration: underline; }
a:hover { color: #cc2200; }
</style>
</helmet>

<div style="min-height: 100vh; width: 100%; background-color: #c6c6c6; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.035) 0, rgba(0,0,0,0.035) 1px, transparent 1px, transparent 4px), repeating-linear-gradient(90deg, rgba(255,255,255,0.35) 0, rgba(255,255,255,0.35) 1px, transparent 1px, transparent 4px); font-family: 'Times New Roman', Times, serif; color: #223; padding-bottom: 30px;">

  <div style="text-align: center; padding: 18px 10px 12px; border-bottom: 4px double #7a7a7a; background: linear-gradient(180deg,#e6e6e6,#b8b8b8);">
    <a href="Home.dc.html" style="text-decoration: none;">
      <div style="display: inline-block; font-family: 'Arial Black', Arial, sans-serif; font-size: 42px; font-weight: 900; letter-spacing: 1px; background: linear-gradient(180deg,#a9c0e8 0%, #3d5686 55%, #16233f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 1px 1px 0 rgba(255,255,255,0.6);">
        MR. TURNER'S SCIENCE CORNER
      </div>
    </a>
    <div style="font-family: 'Courier New', monospace; font-size: 12px; font-weight: 700; color: #4a4a4a; margin-top: 4px;">✦ mrturner.hometown.net ✦ Physical Science &amp; Chemistry — Lincoln High School ✦</div>
  </div>

  <div style="max-width: 900px; margin: 18px auto 0; display: flex; background: #d6d6d6; border-width: 2px; border-style: outset; border-color: #fff #808080 #808080 #fff;">

    <div style="width: 128px; flex-shrink: 0; display: flex; flex-direction: column; gap: 7px; padding: 14px 10px;">
      <a href="Home.dc.html" style="display: block; text-align: center; padding: 8px 4px; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; color: #fff; text-decoration: none; background: linear-gradient(180deg,#9db3d9,#3d5686); border-width: 2px; border-style: outset; border-color: #d8e2f2 #16233f #16233f #d8e2f2;">HOME</a>
      <a href="Profile.dc.html" style="display: block; text-align: center; padding: 8px 4px; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; color: #fff; text-decoration: none; background: linear-gradient(180deg,#9db3d9,#3d5686); border-width: 2px; border-style: outset; border-color: #d8e2f2 #16233f #16233f #d8e2f2;">PROFILE</a>
      <a href="Notice.dc.html" style="display: block; text-align: center; padding: 8px 4px; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; color: #fff; text-decoration: none; background: linear-gradient(180deg,#9db3d9,#3d5686); border-width: 2px; border-style: outset; border-color: #d8e2f2 #16233f #16233f #d8e2f2;">NOTICE</a>
      <a href="Board.dc.html" style="display: block; text-align: center; padding: 8px 4px; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; color: #fff; text-decoration: none; background: linear-gradient(180deg,#9db3d9,#3d5686); border-width: 2px; border-style: outset; border-color: #d8e2f2 #16233f #16233f #d8e2f2;">BOARD</a>
      <a href="Photos.dc.html" style="display: block; text-align: center; padding: 8px 4px; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; color: #fff; text-decoration: none; background: linear-gradient(180deg,#e0949c,#9c2c38); border-width: 2px; border-style: outset; border-color: #ffd9dd #601018 #601018 #ffd9dd;">PHOTOS</a>
      <a href="Videos.dc.html" style="display: block; text-align: center; padding: 8px 4px; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; color: #fff; text-decoration: none; background: linear-gradient(180deg,#9db3d9,#3d5686); border-width: 2px; border-style: outset; border-color: #d8e2f2 #16233f #16233f #d8e2f2;">VIDEOS</a>
      <a href="Projects.dc.html" style="display: block; text-align: center; padding: 8px 4px; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; color: #fff; text-decoration: none; background: linear-gradient(180deg,#9db3d9,#3d5686); border-width: 2px; border-style: outset; border-color: #d8e2f2 #16233f #16233f #d8e2f2;">PROJECTS</a>
    </div>

    <div style="flex: 1; min-width: 0; background: #ececec; border-left-width: 2px; border-left-style: inset; border-left-color: #808080; padding: 22px 26px;">

      <div style="display: flex; gap: 16px; font-family: Arial, sans-serif; font-weight: 700; font-size: 14px; margin-bottom: 16px; flex-wrap: wrap;">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
          <a href="#" onClick="{{ selectTab }}" data-tab="{{ t }}" style="color: {{ t === activeTab ? '#9c2c38' : '#223' }}; text-decoration: {{ t === activeTab ? 'underline' : 'none' }};">{{ t }}</a>
        </sc-for>
      </div>

      <div style="border: 2px solid #999; padding: 8px; background: transparent;">
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #999;">
          <sc-for list="{{ visiblePhotos }}" as="ph" hint-placeholder-count="8">
            <a href="PostView.dc.html?id={{ ph.id }}" style="background: #ececec; padding: 8px; text-decoration: none; display: block;">
              <div style="width: 100%; aspect-ratio: 1; background: repeating-linear-gradient(45deg, #dcdcdc, #dcdcdc 8px, #f4f4f4 8px, #f4f4f4 16px); border: 1px solid #999; display: flex; align-items: center; justify-content: center; font-family: monospace; font-size: 9px; color: #555; text-align: center;">
                [ thumb ]
              </div>
              <div style="font-size: 11px; color: #333; margin-top: 4px; text-align: center;">{{ ph.caption }}</div>
            </a>
          </sc-for>
        </div>
      </div>

      <div style="text-align: center; margin-top: 18px; font-family: Arial, sans-serif; font-weight: 700; font-size: 14px;">
        [1] <a href="#">2</a>
      </div>

    </div>
  </div>

  <div style="max-width: 900px; margin: 14px auto 0; text-align: center; font-size: 11px; color: #555;">Best viewed at 800x600 · Netscape Navigator 4.0+ / IE 5.0+ · Last updated 2004.02.03</div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const PHOTOS = [
  { id: 'photo-1', caption: 'Class of 04', cat: 'Classroom' },
  { id: 'photo-2', caption: 'Room 214', cat: 'Classroom' },
  { id: 'photo-3', caption: 'Volcano demo', cat: 'Experiments' },
  { id: 'photo-4', caption: 'Egg drop', cat: 'Experiments' },
  { id: 'photo-5', caption: 'Dry ice fun', cat: 'Experiments' },
  { id: 'photo-6', caption: 'Museum trip', cat: 'Field Trips' },
  { id: 'photo-7', caption: 'Planetarium', cat: 'Field Trips' },
  { id: 'photo-8', caption: 'Eclipse night', cat: 'Field Trips' }
];
class Component extends DCLogic {
  state = { activeTab: 'All' };
  selectTab = (e) => {
    e.preventDefault();
    this.setState({ activeTab: e.currentTarget.getAttribute('data-tab') });
  };
  renderVals() {
    const tabs = ['All', 'Classroom', 'Experiments', 'Field Trips'];
    return {
      tabs,
      activeTab: this.state.activeTab,
      selectTab: this.selectTab,
      visiblePhotos: this.state.activeTab === 'All' ? PHOTOS : PHOTOS.filter(p => p.cat === this.state.activeTab)
    };
  }
}

</script>
</body>
</html>
